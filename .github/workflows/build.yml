name: Build TvAnti
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned Unity packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for spec in 'TvAnti22.x|2022.3' 'TvAnti6.2|6000.2'; do
            IFS='|' read -r name unity <<< "$spec"
            mkdir -p "dist/$name"
            cp -R package/. "dist/$name/"
            python3 - "$name" "$unity" <<'PY'
import json,sys
name,unity=sys.argv[1:]
p=f"dist/{name}/package.json"
d=json.load(open(p)); d["displayName"]=name; d["unity"]=unity
open(p,"w").write(json.dumps(d,indent=2)+"\n")
PY
            (cd dist && zip -qr "${name}.zip" "$name")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TvAnti
          path: dist/*.zip
